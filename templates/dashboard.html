<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-5">

<h2>📊 Security Dashboard</h2>

<div class="row mb-4">
    <div class="col-md-6">
        <div class="alert alert-success fs-5">
            <strong>SAFE COMMENTS:</strong> {{ safe }}
        </div>
    </div>
    <div class="col-md-6">
        <div class="alert alert-danger fs-5">
            <strong>RISKY COMMENTS:</strong> {{ risky }}
        </div>
    </div>
</div>

<h4>Comment Log</h4>
<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Blog ID</th>
            <th>Content</th>
            <th>Risk Level</th>
        </tr>
    </thead>
    <tbody>
        {% for c in comments %}
        <tr class="{% if c[3] == 'RISKY' %}table-danger{% else %}table-success{% endif %}">
            <td>{{ c[0] }}</td>
            <td>{{ c[1] }}</td>
            <td>{{ c[2] }}</td>
            <td>{{ c[3] }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4" class="text-center">No comments found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="/" class="btn btn-primary">⬅ Back</a>

</body>
</html>
