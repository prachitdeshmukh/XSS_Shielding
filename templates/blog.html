<!DOCTYPE html>
<html>
<head>
    <title>{{ blog[1] }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #ffffff;
            font-family: Georgia, serif;
        }

        .container {
            max-width: 800px;
            margin-top: 40px;
        }

        .title {
            font-size: 34px;
            font-weight: bold;
        }

        .content {
            font-size: 18px;
            margin-top: 20px;
            line-height: 1.7;
        }

        .comment {
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .SAFE {
            background: #d4edda;
        }

        .RISKY {
            background: #f8d7da;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/" class="btn btn-light mb-3">← Back</a>

    <div class="title">{{ blog[1] }}</div>

    <div class="content">
        {{ blog[2] }}
    </div>

    <hr>

    <h4>Comments</h4>

    <form method="POST" action="/add_comment/{{ blog_id }}">

        <input
            name="comment"
            id="commentInput"
            class="form-control"
            placeholder="Write comment"
            oninput="checkHarmful()"
            required
        >

        <button class="btn btn-primary mt-2">
            Post
        </button>

    </form>

    {% for c in comments %}

        <div class="comment {{ c[3] }}">

            <b>{{ c[3] }}</b>
            <br>

            {{ c[2] }}

            <br><br>

            <a
                href="/delete/{{ c[0] }}/{{ blog_id }}"
                class="btn btn-danger btn-sm"
            >
                Delete
            </a>

        </div>

    {% endfor %}

</div>


<!-- HARMFUL COMMENT DETECTION -->

<script>

function checkHarmful() {

    let input = document.getElementById("commentInput");

    let text = input.value.toLowerCase();

    if (
        text.includes("<script") ||
        text.includes("alert(") ||
        text.includes("javascript:") ||
        text.includes("onerror=") ||
        text.includes("<iframe") ||
        text.includes("onload=")
    ) {

        alert(
            "⚠ Harmful comment detected! It will still be submitted and marked as RISKY."
        );

    }

}


window.onload = function () {

    let comments = {{ comments | tojson }};

    let found = false;

    for (let i = 0; i < comments.length; i++) {

        let text = comments[i][2].toLowerCase();

        if (
            text.includes("<script") ||
            text.includes("alert(") ||
            text.includes("javascript:") ||
            text.includes("onerror=") ||
            text.includes("<iframe") ||
            text.includes("onload=")
        ) {

            found = true;
            break;

        }

    }

    if (found) {

        alert(
            "⚠ Stored XSS Detected in Blog Page!"
        );

    }

};

</script>

</body>
</html>
